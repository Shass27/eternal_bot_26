controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names:  ["front_left_joint", "rear_left_joint"]
    right_wheel_names: ["front_right_joint", "rear_right_joint"]
    wheel_separation: 0.33        # centre-to-centre of wheel treads (wheels span y 0.14 -> 0.19)
    wheel_radius: 0.05            # measured from wheel STL: 100 mm diameter
    base_frame_id: base_link
    odom_frame_id: odom
    publish_rate: 50.0
    cmd_vel_timeout: 0.5          # robot stops if no cmd for this long; publish at >= 5 Hz
    # Jazzy DDC only accepts geometry_msgs/TwistStamped on ~/cmd_vel; plain Twist on /cmd_vel goes through twist_to_stamped
